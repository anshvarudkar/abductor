<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abductor - Game UI Elements</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1f4d 100%);
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        
        h2 {
            color: #00ffaa;
            text-align: center;
            font-size: 32px;
            margin: 30px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .ui-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ffaa;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
        }
        
        .section-title {
            color: #4dd8ff;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* Health Bar */
        .health-container {
            position: relative;
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #ff00ff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600, #ffaa00);
            transition: width 0.3s ease;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.8);
        }
        
        .health-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
        }
        
        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        
        /* Star Rating Display */
        .stars-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        
        .star {
            width: 80px;
            height: 80px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .star:hover {
            transform: scale(1.2) rotate(10deg);
        }
        
        .star.earned {
            animation: starEarn 0.6s ease;
        }
        
        @keyframes starEarn {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        
        /* Action Buttons */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .game-button {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .game-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .game-button:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-abduct {
            background: linear-gradient(135deg, #00ff88, #00ffff);
            color: #0a0e27;
        }
        
        .btn-abduct:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.5);
        }
        
        .btn-shoot {
            background: linear-gradient(135deg, #ff0066, #ff6600);
            color: white;
        }
        
        .btn-shoot:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 0, 102, 0.5);
        }
        
        .btn-block {
            background: linear-gradient(135deg, #4d4dff, #9933ff);
            color: white;
        }
        
        .btn-block:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(77, 77, 255, 0.5);
        }
        
        /* Level Complete Banner */
        .level-banner {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 255, 0.2));
            border: 4px solid #00ffaa;
            border-radius: 20px;
            margin: 30px 0;
            animation: bannerPulse 2s ease-in-out infinite;
        }
        
        @keyframes bannerPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 255, 170, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 255, 170, 0.8); }
        }
        
        .banner-text {
            font-size: 48px;
            font-weight: bold;
            color: #00ffaa;
            text-shadow: 0 0 20px rgba(0, 255, 170, 0.8);
            margin: 0;
        }
        
        /* Game Over Screen */
        .game-over {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, rgba(255, 0, 102, 0.2), rgba(255, 0, 255, 0.2));
            border: 4px solid #ff0066;
            border-radius: 20px;
            margin: 30px 0;
        }
        
        .game-over-text {
            font-size: 48px;
            font-weight: bold;
            color: #ff0066;
            text-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
            margin: 0 0 20px 0;
        }
        
        .score-display {
            font-size: 32px;
            color: #ffaa00;
            margin: 10px 0;
        }
        
        /* Score Counter */
        .score-counter {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px solid #ffaa00;
        }
        
        .counter-item {
            text-align: center;
        }
        
        .counter-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .counter-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
        }
        
        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h2>🛸 Abductor - Game UI Elements 🛸</h2>
    
    <!-- Health Bar Section -->
    <div class="ui-section">
        <div class="section-title">Health Bar</div>
        <div class="health-container">
            <div class="health-bar" id="healthBar" style="width: 75%;"></div>
            <div class="health-text" id="healthText">75 / 100</div>
        </div>
        <p style="margin-top: 15px; text-align: center; color: #aaa;">
            <button onclick="damageHealth()" style="margin: 5px; padding: 10px 20px; background: #ff0066; border: none; border-radius: 5px; color: white; cursor: pointer;">Take Damage</button>
            <button onclick="healHealth()" style="margin: 5px; padding: 10px 20px; background: #00ff88; border: none; border-radius: 5px; color: #0a0e27; cursor: pointer;">Heal</button>
        </p>
    </div>
    
    <!-- Star Rating Display -->
    <div class="ui-section">
        <div class="section-title">Star Rating System</div>
        <div class="stars-display">
            <canvas class="star" id="star1" width="80" height="80" onclick="toggleStar(1)"></canvas>
            <canvas class="star" id="star2" width="80" height="80" onclick="toggleStar(2)"></canvas>
            <canvas class="star" id="star3" width="80" height="80" onclick="toggleStar(3)"></canvas>
        </div>
        <p style="text-align: center; color: #aaa;">Click stars to toggle earned/unearned state</p>
    </div>
    
    <!-- Action Buttons -->
    <div class="ui-section">
        <div class="section-title">Action Buttons</div>
        <div class="button-grid">
            <button class="game-button btn-abduct" onclick="buttonAction('Abduct')">
                🛸 Abduct
            </button>
            <button class="game-button btn-shoot" onclick="buttonAction('Shoot')">
                💥 Shoot
            </button>
            <button class="game-button btn-block" onclick="buttonAction('Block')">
                🛡️ Block
            </button>
        </div>
    </div>
    
    <!-- Score Display -->
    <div class="ui-section">
        <div class="section-title">Score Counter</div>
        <div class="score-counter">
            <div class="counter-item">
                <div class="counter-label">Score</div>
                <div class="counter-value" id="scoreValue">1,234</div>
            </div>
            <div class="counter-item">
                <div class="counter-label">Level</div>
                <div class="counter-value" id="levelValue">3</div>
            </div>
            <div class="counter-item">
                <div class="counter-label">Size</div>
                <div class="counter-value" id="sizeValue">x2.5</div>
            </div>
        </div>
    </div>
    
    <!-- Level Complete Banner -->
    <div class="ui-section">
        <div class="section-title">Level Complete Banner</div>
        <div class="level-banner">
            <h1 class="banner-text">✨ LEVEL PASSED ✨</h1>
            <div class="stars-display" style="margin-top: 20px;">
                <canvas class="star earned" width="80" height="80"></canvas>
                <canvas class="star earned" width="80" height="80"></canvas>
                <canvas class="star earned" width="80" height="80"></canvas>
            </div>
        </div>
    </div>
    
    <!-- Game Over Screen -->
    <div class="ui-section">
        <div class="section-title">Game Over Screen</div>
        <div class="game-over">
            <h1 class="game-over-text">💀 GAME OVER 💀</h1>
            <div class="score-display">Final Score: 2,450</div>
            <div class="stars-display" style="margin-top: 20px;">
                <canvas class="star earned" width="60" height="60"></canvas>
                <canvas class="star earned" width="60" height="60"></canvas>
                <canvas class="star" width="60" height="60"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        // Health Bar Management
        let currentHealth = 75;
        const maxHealth = 100;
        
        function updateHealthBar() {
            const healthBar = document.getElementById('healthBar');
            const healthText = document.getElementById('healthText');
            const percentage = (currentHealth / maxHealth) * 100;
            
            healthBar.style.width = percentage + '%';
            healthText.textContent = currentHealth + ' / ' + maxHealth;
            
            // Change color based on health level
            if (percentage > 60) {
                healthBar.style.background = 'linear-gradient(90deg, #00ff00, #88ff00)';
            } else if (percentage > 30) {
                healthBar.style.background = 'linear-gradient(90deg, #ffaa00, #ff6600)';
            } else {
                healthBar.style.background = 'linear-gradient(90deg, #ff0000, #ff0066)';
            }
        }
        
        function damageHealth() {
            currentHealth = Math.max(0, currentHealth - 15);
            updateHealthBar();
        }
        
        function healHealth() {
            currentHealth = Math.min(maxHealth, currentHealth + 20);
            updateHealthBar();
        }
        
        // Star Drawing
        const starStates = [false, false, false];
        
        function drawStar(canvasId, earned) {
            const canvas = document.getElementById(canvasId) || canvasId;
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const outerRadius = 35;
            const innerRadius = 15;
            const points = 5;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Draw star shape
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / points - Math.PI / 2;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            
            if (earned) {
                // Filled star with gradient
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, outerRadius);
                gradient.addColorStop(0, '#ffff00');
                gradient.addColorStop(0.5, '#ffaa00');
                gradient.addColorStop(1, '#ff6600');
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Glow effect
                ctx.shadowColor = '#ffff00';
                ctx.shadowBlur = 20;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                // Empty star outline
                ctx.strokeStyle = '#666666';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = 'rgba(100, 100, 100, 0.2)';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function toggleStar(starNum) {
            const index = starNum - 1;
            starStates[index] = !starStates[index];
            const canvas = document.getElementById('star' + starNum);
            if (starStates[index]) {
                canvas.classList.add('earned');
            }
            drawStar('star' + starNum, starStates[index]);
        }
        
        // Initialize stars
        drawStar('star1', false);
        drawStar('star2', false);
        drawStar('star3', false);
        
        // Draw stars for level complete and game over banners
        document.querySelectorAll('.level-banner .star, .game-over .star').forEach((canvas, index) => {
            drawStar(canvas, canvas.classList.contains('earned'));
        });
        
        // Button actions
        function buttonAction(action) {
            console.log(action + ' button pressed!');
            // Visual feedback
            event.target.style.transform = 'scale(0.95)';
            setTimeout(() => {
                event.target.style.transform = '';
            }, 100);
        }
        
        // Animate score counter
        function animateCounter() {
            const score = document.getElementById('scoreValue');
            let current = parseInt(score.textContent.replace(',', ''));
            current += Math.floor(Math.random() * 50);
            score.textContent = current.toLocaleString();
        }
        
        setInterval(animateCounter, 2000);
    </script>
</body>
</html>
